    // ==========================================
    // 1. REACTBITS COMPONENT: Particles Background
    // ==========================================
    function ParticlesBackground() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let mouse = { x: null, y: null, radius: 130 };

        const resize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resize();
        window.addEventListener('resize', resize);

        const handleMouseMove = (e) => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        };
        const handleMouseLeave = () => {
          mouse.x = null;
          mouse.y = null;
        };
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseleave', handleMouseLeave);

        // Criar partículas
        const particleCount = Math.floor(window.innerWidth > 768 ? 65 : 30);
        const particles = [];
        for (let i = 0; i < particleCount; i++) {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 1,
            speedX: (Math.random() - 0.5) * 0.4,
            speedY: (Math.random() - 0.5) * 0.4,
            color: Math.random() > 0.4 ? 'rgba(16, 185, 129, ' : 'rgba(6, 182, 212, ',
            alpha: Math.random() * 0.5 + 0.25
          });
        }

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.speedX;
            p.y += p.speedY;

            if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
            if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;

            if (mouse.x !== null) {
              const dx = mouse.x - p.x;
              const dy = mouse.y - p.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < mouse.radius) {
                const force = (mouse.radius - dist) / mouse.radius;
                p.x -= (dx / dist) * force * 1.5;
                p.y -= (dy / dist) * force * 1.5;
              }
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = p.color + p.alpha + ')';
            ctx.fill();

            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const dx = p.x - p2.x;
              const dy = p.y - p2.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < 110) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                const lineAlpha = (1 - dist / 110) * 0.16;
                ctx.strokeStyle = `rgba(16, 185, 129, ${lineAlpha})`;
                ctx.lineWidth = 0.7;
                ctx.stroke();
              }
            }
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', resize);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseleave', handleMouseLeave);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-none z-0 opacity-70"
        />
      );
    }

    // ==========================================
    // 2. REACTBITS COMPONENT: SplitText
    // ==========================================
    function SplitText({ text = "", className = "", delay = 40 }) {
      const [mounted, setMounted] = useState(false);

      useEffect(() => {
        setMounted(true);
      }, []);

      return (
        <span className={`inline-block overflow-hidden ${className}`}>
          {text.split('').map((char, index) => (
            <span
              key={index}
              className="inline-block transition-all duration-700 ease-out"
              style={{
                opacity: mounted ? 1 : 0,
                transform: mounted ? 'translateY(0) rotate(0deg)' : 'translateY(100%) rotate(5deg)',
                transitionDelay: `${index * delay}ms`,
                display: char === ' ' ? 'inline' : 'inline-block'
              }}
            >
              {char === ' ' ? '\u00A0' : char}
            </span>
          ))}
        </span>
      );
    }

    // ==========================================
    // 3. REACTBITS COMPONENT: BlurText
    // ==========================================
    function BlurText({ text = "", className = "", delay = 60, as: Component = "p" }) {
      const [visible, setVisible] = useState(false);
      const ref = useRef(null);

      useEffect(() => {
        const observer = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) {
            setVisible(true);
          }
        }, { threshold: 0.1 });

        if (ref.current) observer.observe(ref.current);
        return () => observer.disconnect();
      }, []);

      const words = text.split(" ");

      return (
        <Component ref={ref} className={`inline-flex flex-wrap gap-x-1.5 ${className}`}>
          {words.map((word, idx) => (
            <span
              key={idx}
              className="inline-block transition-all duration-700"
              style={{
                filter: visible ? 'blur(0px)' : 'blur(10px)',
                opacity: visible ? 1 : 0,
                transform: visible ? 'translateY(0)' : 'translateY(12px)',
                transitionDelay: `${idx * delay}ms`
              }}
            >
              {word}
            </span>
          ))}
        </Component>
      );
    }

    // ==========================================
    // 6. REACTBITS COMPONENT: RotatingText
    // ==========================================
    function RotatingText({ texts = [], interval = 2500, className = "" }) {
      const [index, setIndex] = useState(0);
      const [fade, setFade] = useState(true);

      useEffect(() => {
        const timer = setInterval(() => {
          setFade(false);
          setTimeout(() => {
            setIndex((prev) => (prev + 1) % texts.length);
            setFade(true);
          }, 300);
        }, interval);

        return () => clearInterval(timer);
      }, [texts, interval]);

      return (
        <span
          className={`inline-block transition-all duration-300 transform ${
            fade ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 translate-y-2 scale-95'
          } ${className}`}
        >
          {texts[index]}
        </span>
      );
    }

    // ==========================================
    // 7. REACTBITS COMPONENT: CountUp
    // ==========================================
    function CountUp({ end = 100, duration = 2, prefix = "", suffix = "", className = "" }) {
      const [count, setCount] = useState(0);
      const ref = useRef(null);
      const [hasAnimated, setHasAnimated] = useState(false);

      useEffect(() => {
        const observer = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting && !hasAnimated) {
            setHasAnimated(true);
            let startTime = null;

            const step = (timestamp) => {
              if (!startTime) startTime = timestamp;
              const progress = Math.min((timestamp - startTime) / (duration * 1000), 1);
              const currentVal = Math.floor(progress * end);
              setCount(currentVal);

              if (progress < 1) {
                requestAnimationFrame(step);
              } else {
                setCount(end);
              }
            };

            requestAnimationFrame(step);
          }
        }, { threshold: 0.2 });

        if (ref.current) observer.observe(ref.current);
        return () => observer.disconnect();
      }, [end, duration, hasAnimated]);

      return (
        <span ref={ref} className={className}>
          {prefix}{count}{suffix}
        </span>
      );
    }

    // ==========================================
    // 8. REACTBITS COMPONENT: SpotlightCard
    // ==========================================
    function SpotlightCard({ children, className = "", spotlightColor = "rgba(16, 185, 129, 0.15)" }) {
      const cardRef = useRef(null);
      const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
      const [isHovered, setIsHovered] = useState(false);

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        setMousePos({
          x: e.clientX - rect.left,
          y: e.clientY - rect.top,
        });
      };

      return (
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => setIsHovered(false)}
          className={`relative overflow-hidden rounded-2xl border border-white/[0.08] bg-[#0c1210]/80 backdrop-blur-md transition-all duration-300 hover:border-emerald-500/30 hover:shadow-2xl hover:shadow-emerald-950/30 ${className}`}
        >
          {/* Luz do Spotlight seguindo o cursor */}
          <div
            className="pointer-events-none absolute -inset-px transition-opacity duration-300"
            style={{
              opacity: isHovered ? 1 : 0,
              background: `radial-gradient(400px circle at ${mousePos.x}px ${mousePos.y}px, ${spotlightColor}, transparent 60%)`,
            }}
          />
          <div className="relative z-10 h-full">{children}</div>
        </div>
      );
    }

    // ==========================================
    // 9. REACTBITS COMPONENT: Magnet Effect
    // ==========================================
    function Magnet({ children, strength = 0.25, className = "" }) {
      const [position, setPosition] = useState({ x: 0, y: 0 });
      const ref = useRef(null);

      const handleMouseMove = (e) => {
        if (!ref.current) return;
        const { left, top, width, height } = ref.current.getBoundingClientRect();
        const centerX = left + width / 2;
        const centerY = top + height / 2;
        const deltaX = (e.clientX - centerX) * strength;
        const deltaY = (e.clientY - centerY) * strength;
        setPosition({ x: deltaX, y: deltaY });
      };

      const handleMouseLeave = () => {
        setPosition({ x: 0, y: 0 });
      };

      return (
        <div
          ref={ref}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          className={`inline-block transition-transform duration-200 ease-out ${className}`}
          style={{ transform: `translate3d(${position.x}px, ${position.y}px, 0)` }}
        >
          {children}
        </div>
      );
    }
